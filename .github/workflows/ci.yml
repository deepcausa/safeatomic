name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-and-type:
    name: Lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test]"

      - name: ruff check
        run: ruff check src/ tests/

      - name: ruff format --check
        run: ruff format --check src/ tests/

      - name: mypy --strict
        run: mypy --strict src/safeatomic

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: pytest with coverage
        run: |
          pytest -v --no-header \
            --cov \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json

      - name: Coverage summary in job log
        if: always()
        run: |
          python -c "
          import json, pathlib
          d = json.loads(pathlib.Path('coverage.json').read_text())
          t = d['totals']
          pct = t['percent_covered_display']
          line = f\"### Coverage (Python ${{ matrix.python-version }}): {pct}%\n\n\"
          line += f\"- Statements: {t['covered_lines']}/{t['num_statements']}\n\"
          line += f\"- Branches:   {t['covered_branches']}/{t['num_branches']}\n\"
          line += f\"- Missing:    {t['missing_lines']} lines, {t['num_partial_branches']} partial branches\n\"
          pathlib.Path('$GITHUB_STEP_SUMMARY').write_text(line)
          print(line)
          "

      - name: Upload coverage XML (Python 3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage to Codecov (Python 3.12 only)
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: unittests
          name: safeatomic-py3.12
          fail_ci_if_error: false  # do not block CI on codecov outage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
