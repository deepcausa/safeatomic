# Publish to PyPI when a GitHub Release is published.
#
# Trigger: create a Release on github.com/deepcausa/safeatomic with tag
# `vX.Y.Z`. This workflow builds sdist + wheel, verifies the wheel does
# not ship the `formal/` directory (it belongs in sdist only), and uploads
# both artifacts to PyPI using the `PYPI_API_TOKEN` repository secret.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distributions
        run: python -m build

      - name: Verify sdist payload and wheel exclusions
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import sys
          import tarfile
          import zipfile

          (sdist,) = glob.glob("dist/*.tar.gz")
          (wheel,) = glob.glob("dist/*.whl")

          print(f"Inspecting {sdist}")
          with tarfile.open(sdist, "r:gz") as tf:
              sdist_names = tf.getnames()
          required = [
              "formal/SafeAtomicSmoke.tla",
              "formal/SafeAtomicLock.tla",
              "formal/SafeAtomicChecksum.tla",
              "scripts/check-formal.sh",
              "docs/formal-models.md",
              "examples/README.md",
              "examples/01_write_read_basic.py",
              "examples/08_config_safety_policy.py",
          ]
          missing = [
              r for r in required
              if not any(n.endswith("/" + r) or n == r for n in sdist_names)
          ]
          if missing:
              print(f"::error::sdist is missing: {missing}", file=sys.stderr)
              sys.exit(1)

          print(f"Inspecting {wheel}")
          with zipfile.ZipFile(wheel) as zf:
              wheel_names = zf.namelist()
          forbidden_prefixes = ("formal/", "examples/", "tests/", "scripts/")
          leaked = [
              n for n in wheel_names
              if any(
                  n.startswith(p) or f"/{p}" in n
                  for p in forbidden_prefixes
              )
          ]
          if leaked:
              print(
                  f"::error::wheel must ship src/ only, leaked: {leaked}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("OK: sdist payload complete, wheel free of non-src paths.")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/safeatomic/
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
